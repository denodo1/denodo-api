spring:
  application:
    name: denodo-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  servlet:
    context-path: /api

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
#  type-aliases-package: com.denodo.platform.api.post.model
#  configuration:
#    map-underscore-to-camel-case: true

file:
  upload:
    dir: /var/app/uploads        # 운영/서버 기본 경로
    serve-static: false          # 운영은 nginx가 /uploads 서빙
    subdir-pattern: "yyyy/MM"    # 2026/01 폴더 규칙

logging:
  level:
    root: info
    com.denodo.platform.api: info
    com.denodo.platform.api.post.mapper: info