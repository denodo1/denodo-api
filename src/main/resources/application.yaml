spring:
  application:
    name: denodo-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      ddl-auto: update # 실무 운영은 none/validate, 로컬은 update
#      naming:
        # 물리 네이밍 전략: 개발자가 적은 이름을 그대로 사용
#        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100 # N+1 문제 완화를 위한 배치 사이즈 설정

server:
  servlet:
    context-path: /api

#mybatis:
#  mapper-locations: classpath:/mapper/**/*.xml

file:
  upload:
    dir: /var/app/uploads        # 운영/서버 기본 경로
    serve-static: false          # 운영은 nginx가 /uploads 서빙
    subdir-pattern: "yyyy/MM"    # 2026/01 폴더 규칙

logging:
  level:
    root: info
    com.denodo.platform.api: info
    com.denodo.platform.api.post.mapper: info